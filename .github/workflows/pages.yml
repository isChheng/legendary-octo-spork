# Publishes the frontend folder to GitHub Pages.
#
# Set Pages -> Build and deployment -> Source to "GitHub Actions".
# To switch datasets, set the BURNLINE_DATA_URL Actions repository variable.
name: Deploy Luminite to GitHub Pages

on:
  push:
    branches: [codex/luminite-pages]
    paths: ["frontend/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Point the site at the hosted data
        env:
          DATA_URL: ${{ vars.BURNLINE_DATA_URL || 'https://huggingface.co/datasets/proros1/burnline-web/resolve/main' }}
          GOOGLE_MAPS_KEY: ${{ vars.BURNLINE_GOOGLE_MAPS_BROWSER_KEY }}
        run: |
          node -e 'require("fs").writeFileSync("frontend/config.js", "export default " + JSON.stringify({ dataUrl: process.env.DATA_URL, googleMapsKey: process.env.GOOGLE_MAPS_KEY || "" }, null, 2) + ";\n")'
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend
      - id: deployment
        uses: actions/deploy-pages@v4
